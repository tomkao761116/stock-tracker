<script>
// ─── State ───────────────────────────────────────────────
let state = { stocks: [], prices: {}, activeId: null };
let _tradeType = 'buy';

function loadState() {
  // legacy localStorage migration only (Firestore is primary)
  try {
    const s = localStorage.getItem('stockCalc_v3');
    if (s) { const d = JSON.parse(s); state.stocks = d.stocks || []; state.activeId = d.activeId || null; }
  } catch(e) {}
}

function saveState() {
  // 先存 localStorage（同步），Firestore 由 initFirebase 覆寫為非同步版本
  localStorage.setItem('stockCalc_v3', JSON.stringify({ stocks: state.stocks, activeId: state.activeId }));
}

// ─── Price Fetch ──────────────────────────────────────────
async function fetchPrice(symbol) {
  // 台股（.TW / .TWO）用 TWSE 即時 API
  const isTW  = symbol.endsWith('.TW');
  const isTWO = symbol.endsWith('.TWO');
  if (isTW || isTWO) {
    const code   = symbol.replace(/\.(TW|TWO)$/i, '');
    const market = isTWO ? 'otc' : 'tse';
    const url    = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${market}_${code}.tw&json=1&delay=0`;
    try {
      const res  = await fetch(proxyUrl(url), { signal: AbortSignal.timeout(6000) });
      const data = await res.json();
      const item = data?.msgArray?.[0];
      if (!item) return null;
      const price = parseFloat(item.z) || parseFloat(item.y); // z=即時價，y=昨收（收盤後）
      const prev  = parseFloat(item.y) || price;
      const chg   = price - prev;
      const chgP  = prev ? (chg / prev * 100) : 0;
      return { price, change: chg, changeP: chgP, name: item.n || symbol };
    } catch(e) { /* fallthrough to Yahoo */ }
  }

  // 美股 / 其他用 Yahoo Finance
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=2d`;
  try {
    const res  = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    const meta = data?.chart?.result?.[0]?.meta;
    if (!meta) return null;
    const price = meta.regularMarketPrice ?? meta.previousClose;
    const prev  = meta.previousClose ?? price;
    const chg   = price - prev;
    const chgP  = prev ? (chg / prev * 100) : 0;
    return { price, change: chg, changeP: chgP, name: meta.longName || meta.shortName || symbol };
  } catch(e) { return null; }
}

async function refreshAllPrices() {
  const symbols = [...new Set(state.stocks.map(s => s.symbol))];
  if (!symbols.length) return;
  const icon = document.getElementById('refreshIcon');
  if (icon) { icon.style.display = 'inline-block'; icon.style.animation = 'spin 1s linear infinite'; }
  await Promise.all(symbols.map(async sym => {
    const data = await fetchPrice(sym);
    if (data) state.prices[sym] = data;
  }));
  const now = new Date();
  const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  const el = document.getElementById('lastUpdateTime');
  if (el) el.textContent = t;
  if (icon) icon.style.animation = '';
  render();
}

setInterval(refreshAllPrices, 30000);

// ─── Calc ─────────────────────────────────────────────────
function calcStats(trades) {
  let totalQty = 0, totalCost = 0, realizedPnL = 0, avgCost = 0;
  let totalDividend = 0; // 累計現金股利收入
  for (const t of trades) {
    if (t.type === 'buy') {
      totalCost += t.qty * t.price; totalQty += t.qty;
      avgCost = totalQty > 0 ? totalCost / totalQty : 0;
    } else if (t.type === 'sell') {
      realizedPnL += t.qty * (t.price - avgCost);
      totalQty -= t.qty; totalCost = avgCost * totalQty;
      if (totalQty <= 0) { totalQty = 0; totalCost = 0; avgCost = 0; }
    } else if (t.type === 'dividend') {
      // 除息：每股現金股利，攤低成本（t.price = 每股股利）
      if (totalQty > 0) {
        const cashIn = t.price * totalQty;
        totalDividend += cashIn;
        totalCost = Math.max(0, totalCost - cashIn);
        avgCost = totalQty > 0 ? totalCost / totalQty : 0;
      }
    } else if (t.type === 'rights') {
      // 除權：配股（t.qty = 配得股數），成本不變、均價下降
      if (totalQty > 0 && t.qty > 0) {
        totalQty += t.qty;
        avgCost = totalQty > 0 ? totalCost / totalQty : 0;
      }
    }
  }
  return { totalQty, avgCost, realizedPnL, totalDividend };
}

// ─── Render ───────────────────────────────────────────────
function render() { renderTabs(); renderMain(); }

function renderTabs() {
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  for (const s of state.stocks) {
    const { totalQty, avgCost } = calcStats(s.trades);
    const pData = state.prices[s.symbol];
    let pnlBadge = '';
    if (pData && totalQty > 0) {
      const pnl = (pData.price - avgCost) * totalQty;
      const up = pnl >= 0;
      pnlBadge = `<span class="ml-1.5 text-xs font-mono font-semibold px-1.5 py-0.5 rounded ${up ? 'bg-red-500/15 text-red-400' : 'bg-emerald-500/15 text-emerald-400'}">${up ? '▲' : '▼'}</span>`;
    }
    const active = s.id === state.activeId;
    const tab = document.createElement('button');
    tab.className = `flex items-center gap-0.5 px-4 py-2.5 text-sm font-semibold border-b-2 transition-all whitespace-nowrap ${active ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`;
    const displayName = s.name || s.symbol;
    const code = s.symbol.replace(/\.(TW|TWO)$/i,'');
    tab.innerHTML = `<span>${displayName}</span><span class="ml-1.5 text-xs font-mono opacity-50">${code}</span>${pnlBadge}`;
    tab.onclick = () => { state.activeId = s.id; saveState(); render(); };
    bar.appendChild(tab);
  }
  const addBtn = document.createElement('button');
  addBtn.className = 'px-4 py-2.5 text-slate-500 hover:text-indigo-400 text-lg font-light transition-colors border-b-2 border-transparent';
  addBtn.textContent = '+';
  addBtn.title = '新增股票';
  addBtn.onclick = openAddModal;
  bar.appendChild(addBtn);
}

function renderMain() {
  const main = document.getElementById('mainContent');
  if (!state.stocks.length) {
    main.innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 fade-in">
        <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-3xl mb-4">📊</div>
        <h2 class="text-lg font-semibold text-slate-300 mb-1">開始追蹤你的投資組合</h2>
        <p class="text-sm text-slate-600 mb-6">點擊上方「+」新增第一支股票</p>
        <button onclick="openAddModal()" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition-all shadow-lg shadow-indigo-500/25">
          + 新增股票
        </button>
      </div>`;
    return;
  }
  // activeId 對不上時自動選第一支
  let stock = state.stocks.find(s => s.id === state.activeId);
  if (!stock && state.stocks.length) {
    state.activeId = state.stocks[0].id;
    stock = state.stocks[0];
    saveState();
  }
  if (!stock) return;
  const { totalQty, avgCost, realizedPnL } = calcStats(stock.trades);
  const pData = state.prices[stock.symbol];
  const currentPrice = pData?.price ?? null;
  const unrealizedPnL = currentPrice != null && totalQty > 0 ? (currentPrice - avgCost) * totalQty : null;
  const returnRate = avgCost > 0 && currentPrice != null ? (currentPrice - avgCost) / avgCost * 100 : null;

  const fmt  = n => n == null ? '—' : n.toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtI = n => n == null ? '—' : Math.round(Math.abs(n)).toLocaleString('zh-TW');
  const sign = n => n >= 0 ? '+' : '-';
  const upDn = n => n >= 0 ? 'text-red-400' : 'text-emerald-400';
  const bgUpDn = n => n >= 0 ? 'bg-red-500/10 border-red-500/20' : 'bg-emerald-500/10 border-emerald-500/20';

  // Price area
  let priceArea = '';
  if (pData) {
    const up = pData.change >= 0;
    priceArea = `
      <div class="text-right">
        <div class="text-3xl font-bold font-mono ${upDn(pData.change)}">${fmt(pData.price)}</div>
        <div class="flex items-center justify-end gap-1.5 mt-1">

          <span class="text-xs px-2 py-0.5 rounded-full font-semibold font-mono ${up ? 'bg-red-500/15 text-red-400' : 'bg-emerald-500/15 text-emerald-400'}">${sign(pData.changeP)}${Math.abs(pData.changeP).toFixed(2)}%</span>

function setTradeType(t) {
  _tradeType = t;
  const ids = { buy:'typeBuyBtn', sell:'typeSellBtn', dividend:'typeDividendBtn', rights:'typeRightsBtn' };
  const active = {
    buy:      'px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-emerald-500/20 text-emerald-400',
    sell:     'px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-red-500/20 text-red-400',
    dividend: 'px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-yellow-500/20 text-yellow-400',
    rights:   'px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-violet-500/20 text-violet-400',
  };
  const inactive = 'px-4 py-2 text-sm font-semibold rounded-lg transition-all text-slate-500 hover:text-slate-300';
  for (const [type, id] of Object.entries(ids)) {
    const el = document.getElementById(id);
    if (el) el.className = type === t ? active[t] : inactive;
  }
  // 動態調整欄位
  const qtyWrap   = document.getElementById('tradeQtyWrap');
  const qtyLabel  = document.getElementById('tradeQtyLabel');
  const priceWrap = document.getElementById('tradePriceWrap');
  const priceLabel= document.getElementById('tradePriceLabel');
  const hint      = document.getElementById('tradeHint');
  const submitBtn = document.getElementById('tradeSubmitBtn');
  const fillBtn   = document.getElementById('fillPriceBtn');
  if (!qtyWrap) return;

  if (t === 'buy' || t === 'sell') {
    qtyWrap.classList.remove('hidden');
    qtyLabel.textContent = '股數';
    priceWrap.classList.remove('hidden');
    priceLabel.textContent = t === 'buy' ? '成交價' : '賣出價';
    if (fillBtn) fillBtn.classList.remove('hidden');
    hint.classList.add('hidden');
  } else if (t === 'dividend') {
    qtyWrap.classList.add('hidden');      // 不需輸入股數（自動用持倉計算）
    priceWrap.classList.remove('hidden');
    priceLabel.textContent = '每股現金股利';
    document.getElementById('tradePrice').placeholder = '例：3.00';
    if (fillBtn) fillBtn.classList.add('hidden');
    hint.textContent = '💡 除息：成本自動攤低 = 每股股利 × 持倉股數，不影響持倉數量';
    hint.classList.remove('hidden');
  } else if (t === 'rights') {
    qtyWrap.classList.remove('hidden');
    qtyLabel.textContent = '配得股數';
    document.getElementById('tradeQty').placeholder = '例：100';
    priceWrap.classList.add('hidden');    // 除權不需要價格
    hint.textContent = '💡 除權：持倉增加配得股數，總成本不變，均價自動下調';
    hint.classList.remove('hidden');
  }

  const btnColor = { buy:'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-500/20', sell:'bg-red-600 hover:bg-red-500 shadow-red-500/20', dividend:'bg-yellow-600 hover:bg-yellow-500 shadow-yellow-500/20', rights:'bg-violet-600 hover:bg-violet-500 shadow-violet-500/20' };
  if (submitBtn) submitBtn.className = `px-6 py-2.5 text-sm font-bold rounded-xl transition-all shadow-lg text-white ${btnColor[t]}`;
}

function addTrade(stockId) {
  const date  = document.getElementById('tradeDate').value;
  const stock = state.stocks.find(s => s.id === stockId);
  if (!stock) return;
  const { totalQty } = calcStats(stock.trades);

  if (_tradeType === 'dividend') {
    const price = parseFloat(document.getElementById('tradePrice').value);
    if (!price || price <= 0) { hlError('tradePrice'); return; }
    if (totalQty <= 0) { alert('目前無持倉，無法記錄除息'); return; }
    stock.trades.push({ type: 'dividend', qty: totalQty, price, date });

  } else if (_tradeType === 'rights') {
    const qty = parseFloat(document.getElementById('tradeQty').value);
    if (!qty || qty <= 0) { hlError('tradeQty'); return; }
    if (totalQty <= 0) { alert('目前無持倉，無法記錄除權'); return; }
    stock.trades.push({ type: 'rights', qty, price: 0, date });

  } else {
    const qty   = parseFloat(document.getElementById('tradeQty').value);
    const price = parseFloat(document.getElementById('tradePrice').value);
    if (!qty || qty <= 0) { hlError('tradeQty'); return; }
    if (!price || price <= 0) { hlError('tradePrice'); return; }
    if (_tradeType === 'sell' && qty > totalQty) {
      alert(`賣出股數 (${qty}) 不得超過持倉 (${totalQty} 股)`); return;
    }
    stock.trades.push({ type: _tradeType, qty, price, date });
  }

  saveState();
  document.getElementById('tradeQty').value = '';
  document.getElementById('tradePrice').value = '';
  render();
}

function hlError(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.borderColor = 'rgba(239,68,68,0.6)';
  setTimeout(() => el.style.borderColor = '', 2000);
}

function deleteTrade(stockId, idx) {
  const stock = state.stocks.find(s => s.id === stockId);
  if (!stock) return;
  stock.trades.splice(idx, 1);
  saveState(); render();
}

function clearTrades(stockId) {
  if (!confirm('確定要清除所有交易記錄？')) return;
  const stock = state.stocks.find(s => s.id === stockId);
  if (stock) { stock.trades = []; saveState(); render(); }
}

function removeStock(stockId) {
  if (!confirm('確定要刪除此股票及所有記錄？')) return;
  state.stocks = state.stocks.filter(s => s.id !== stockId);
  state.activeId = state.stocks[0]?.id ?? null;
  saveState(); render();
}

async function refreshSingle(symbol) {
  const data = await fetchPrice(symbol);
  if (data) { state.prices[symbol] = data; render(); }
}

const YF_PROXY = 'https://yf-proxy.aiden761116.workers.dev';
function proxyUrl(url) { return `${YF_PROXY}/?url=${encodeURIComponent(url)}`; }

// ── 台股清單快取（來自 TWSE STOCK_DAY_ALL）─────────────
let _twStockCache = null;
let _twStockCacheTime = 0;
const TW_CACHE_TTL = 6 * 60 * 60 * 1000; // 6小時更新一次

async function getTWStockList() {
  const now = Date.now();
  // 先從 localStorage 讀快取
  if (!_twStockCache) {
    try {
      const cached = JSON.parse(localStorage.getItem('twStockList') || 'null');
      if (cached && now - cached.ts < TW_CACHE_TTL) {
        _twStockCache = cached.data;
        _twStockCacheTime = cached.ts;
      }
    } catch(e) {}
  }
  if (_twStockCache) return _twStockCache;

  // 重新抓取
  try {
    const url = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
    const res  = await fetch(proxyUrl(url), { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    // 格式化：{ code, name, price, change }
    _twStockCache = data.map(s => ({
      code:   s.Code,
      name:   s.Name,
      symbol: s.Code + '.TW',
      price:  parseFloat(s.ClosingPrice) || 0,
      change: parseFloat(s.Change) || 0,
    }));
    localStorage.setItem('twStockList', JSON.stringify({ ts: now, data: _twStockCache }));
    return _twStockCache;
  } catch(e) { return []; }
}

async function searchStocks(query) {
  if (!query || query.length < 1) return [];
  const q = query.trim();
  const hasChinese = /[一-鿿]/.test(q);
  const isDigits   = /^\d{2,6}[A-Za-z]?$/.test(q);  // 台股代號（含如 00679B）
  const isEnglish  = /^[A-Za-z][A-Za-z0-9.]{0,9}$/.test(q);

  // ── 台股 / ETF：從 TWSE 完整清單搜尋 ──
  if (hasChinese || isDigits) {
    const list = await getTWStockList();
    const hits = list.filter(s =>
      s.name.includes(q) ||
      s.code.startsWith(q.toUpperCase()) ||
      s.code === q.toUpperCase()
    ).slice(0, 8);

    return hits.map(s => ({
      symbol:    s.symbol,
      shortname: s.name,
      longname:  s.name,
      exchange:  'TAI',
      quoteType: s.code.startsWith('0') ? 'ETF' : 'EQUITY',
      _price:    s.price,
      _change:   s.change,
    }));
  }

  // ── 美股 / 其他：Yahoo Finance API 搜尋 ──
  if (isEnglish) {
    const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0&enableFuzzyQuery=true`;
    try {
      const res  = await fetch(proxyUrl(url), { signal: AbortSignal.timeout(6000) });
      const data = await res.json();
      const hits = (data?.quotes || []).filter(r =>
        r.symbol && ['EQUITY','ETF','MUTUALFUND','INDEX'].includes(r.quoteType)
      ).slice(0, 8);
      if (hits.length) return hits;
    } catch(e) {}
    // fallback: 直接驗證代號
    try {
      const price = await fetchPrice(q.toUpperCase());
      if (price) return [{ symbol: q.toUpperCase(), shortname: price.name, longname: price.name, exchange: '', quoteType: 'EQUITY' }];
    } catch(e) {}
  }

  return [];
}

function parseImportFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
      processImportRows(raw, file.name);
    } catch(err) {
      alert('檔案解析失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Flexible header mapping
const COL_MAP = {
  symbol: ['symbol','股票','股票代號','ticker','代號'],
  type:   ['type','類型','買賣','操作','action'],
  qty:    ['qty','數量','股數','quantity','shares','張數'],
  price:  ['price','價格','成交價','成交均價','cost'],
  date:   ['date','日期','交易日','trade_date'],
};

function normalizeHeader(headers) {
  const map = {};
  for (const [field, aliases] of Object.entries(COL_MAP)) {
    for (const h of headers) {
      if (aliases.includes(h.toLowerCase().trim())) { map[field] = h; break; }
    }
  }
  return map;
}

function processImportRows(raw, filename) {
  if (!raw.length) { alert('檔案內無資料'); return; }
  const headers = Object.keys(raw[0]);
  const colMap = normalizeHeader(headers);
  const missing = ['symbol','type','qty','price'].filter(f => !colMap[f]);
  if (missing.length) {
    alert(`找不到必要欄位：${missing.join(', ')}\n請確認欄位名稱或下載範本參考格式`);
    return;
  }

  _importRows = raw.map((row, i) => {
    const symbol = String(row[colMap.symbol] || '').trim().toUpperCase();
    const typeRaw = String(row[colMap.type] || '').trim().toLowerCase();
    const type = ['buy','買入','買'].includes(typeRaw) ? 'buy' : ['sell','賣出','賣'].includes(typeRaw) ? 'sell' : null;
    const qty   = parseFloat(row[colMap.qty]);
    const price = parseFloat(row[colMap.price]);
    let date = '';
    if (colMap.date && row[colMap.date]) {
      const d = row[colMap.date];
      if (d instanceof Date) date = d.toISOString().split('T')[0];
      else date = String(d).trim();
    }
    const errors = [];
    if (!symbol) errors.push('缺少股票代號');
    if (!type)   errors.push('類型須為 buy/sell');
    if (!qty || qty <= 0)     errors.push('股數無效');
    if (!price || price <= 0) errors.push('價格無效');
    return { symbol, type, qty, price, date, errors, rowNum: i + 2 };
  });

  renderImportPreview(filename);
}

function renderImportPreview(filename) {
  const valid   = _importRows.filter(r => !r.errors.length);
  const invalid = _importRows.filter(r =>  r.errors.length);
  const fmt = n => Number(n).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Group valid rows by symbol
  const grouped = {};
  for (const r of _importRows) {
    const key = r.symbol || '（未知）';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  }

  // ── Stock summary chips ──
  const chipColors = ['bg-indigo-500/15 border-indigo-500/30 text-indigo-300',
                      'bg-violet-500/15 border-violet-500/30 text-violet-300',
                      'bg-sky-500/15 border-sky-500/30 text-sky-300',
                      'bg-teal-500/15 border-teal-500/30 text-teal-300'];
  const symbols = Object.keys(grouped).filter(s => s !== '（未知）');
  document.getElementById('importStockSummary').innerHTML =
    symbols.map((sym, i) => {
      const rows  = grouped[sym];
      const okCnt = rows.filter(r => !r.errors.length).length;
      const color = chipColors[i % chipColors.length];
      const isNew = !state.stocks.find(s => s.symbol === sym);
      return `<div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-semibold ${color}">
        <span class="font-mono">${sym}</span>
        <span class="opacity-60">${okCnt} 筆</span>
        ${isNew ? '<span class="bg-white/10 px-1.5 py-0.5 rounded text-xs font-normal opacity-80">新增</span>' : ''}
      </div>`;
    }).join('') +
    (grouped['（未知）'] ? `<div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-red-500/30 bg-red-500/10 text-red-400 text-xs font-semibold">⚠ 未知代號 ${grouped['（未知）'].length} 筆</div>` : '');

  // ── Grouped detail tables ──
  document.getElementById('importPreviewBody').innerHTML = symbols.map((sym, i) => {
    const rows = grouped[sym];
    const color = chipColors[i % chipColors.length];
    const rows_html = rows.map(r => {
      const ok = !r.errors.length;
      return `<tr class="border-b border-white/[0.03] ${ok ? '' : 'bg-red-500/5'} hover:bg-white/[0.02] transition-colors">
        <td class="py-2 px-3">
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${r.type === 'buy' ? 'bg-emerald-500/15 text-emerald-400' : r.type === 'sell' ? 'bg-red-500/15 text-red-400' : 'bg-slate-700 text-slate-500'}">
            ${r.type === 'buy' ? '買入' : r.type === 'sell' ? '賣出' : '?'}
          </span>
        </td>
        <td class="py-2 px-3 text-right font-mono text-slate-200">${r.qty > 0 ? r.qty.toLocaleString() : '—'}</td>
        <td class="py-2 px-3 text-right font-mono text-slate-200">${r.price > 0 ? fmt(r.price) : '—'}</td>
        <td class="py-2 px-3 text-slate-500 font-mono text-xs">${r.date || '—'}</td>
        <td class="py-2 px-3 text-right">${ok
          ? '<span class="text-emerald-400 text-xs">✓</span>'
          : `<span class="text-red-400 text-xs">${r.errors.join('、')}</span>`}</td>
      </tr>`;
    }).join('');

    return `<div class="rounded-xl border border-white/5 overflow-hidden">
      <div class="flex items-center gap-2 px-4 py-2.5 bg-slate-800/60 border-b border-white/5">
        <span class="text-xs font-bold font-mono px-2 py-0.5 rounded-lg border ${color}">${sym}</span>
        <span class="text-xs text-slate-500">${rows.filter(r=>!r.errors.length).length} / ${rows.length} 筆有效</span>
      </div>
      <table class="w-full text-xs">
        <thead><tr class="text-slate-600 uppercase tracking-wider border-b border-white/5 bg-slate-800/30">
          <th class="text-left py-2 px-3 font-semibold">類型</th>
          <th class="text-right py-2 px-3 font-semibold">股數</th>
          <th class="text-right py-2 px-3 font-semibold">價格</th>
          <th class="text-left py-2 px-3 font-semibold">日期</th>
          <th class="text-right py-2 px-3 font-semibold">狀態</th>
        </tr></thead>
        <tbody>${rows_html}</tbody>
      </table>
    </div>`;
  }).join('');

  // ── Counts & status ──
  document.getElementById('importPreviewCount').textContent =
    `${symbols.length} 支股票 · ${valid.length} 筆有效 / 共 ${_importRows.length} 筆`;
  document.getElementById('importPreview').classList.remove('hidden');

  const errSummary = document.getElementById('importErrorSummary');
  if (invalid.length) {
    errSummary.textContent = `⚠ ${invalid.length} 筆資料有錯誤（已標紅），匯入時自動略過`;
    errSummary.classList.remove('hidden');
  } else {
    errSummary.classList.add('hidden');
  }

  document.getElementById('importConfirmBtn').disabled = valid.length === 0;
  document.getElementById('importConfirmBtn').textContent =
    `確認匯入 ${symbols.length} 支股票`;
  document.getElementById('importFooterHint').textContent = `來源：${filename}`;
}

async function confirmImport() {
  const valid = _importRows.filter(r => !r.errors.length);
  const newSymbols = new Set();

  for (const row of valid) {
    let stock = state.stocks.find(s => s.symbol === row.symbol);
    if (!stock) {
      const id = Date.now().toString() + Math.random().toString(36).slice(2,5);
      stock = { id, symbol: row.symbol, name: '', trades: [] };
      state.stocks.push(stock);
      newSymbols.add(row.symbol);
    }
    stock.trades.push({ type: row.type, qty: row.qty, price: row.price, date: row.date });
  }

  if (state.stocks.length > 0 && !state.activeId) {
    state.activeId = state.stocks[0].id;
  }

  saveState();
  closeImportModal();
  render();

  // Fetch prices for new symbols
  if (newSymbols.size) {
    await Promise.all([...newSymbols].map(async sym => {
      const data = await fetchPrice(sym);
      if (data) state.prices[sym] = data;
    }));
    render();
  }
}

async function fetchDividendEvents(stockId, symbol) {
  const panel = document.getElementById('dividendPanel');
  panel.classList.remove('hidden');
  panel.innerHTML = `
    <div class="px-5 py-4 flex items-center gap-2 text-sm text-yellow-400">
      <span class="shimmer">⏳</span> 查詢 ${symbol} 除權息記錄中…
    </div>`;

  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?events=dividends%2Csplits&range=10y&interval=1d`;
    const res  = await fetch(proxyUrl(url), { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    const result = data?.chart?.result?.[0];
    const events = result?.events || {};
    const dividends = events.dividends ? Object.values(events.dividends) : [];
    const splits    = events.splits    ? Object.values(events.splits)    : [];

    // 整理成統一格式
    const stock = state.stocks.find(s => s.id === stockId);
    const recordedDates = new Set(
      stock.trades
        .filter(t => t.type === 'dividend' || t.type === 'rights')
        .map(t => t.date)
    );

    const items = [
      ...dividends.map(d => ({
        type: 'dividend',
        date: new Date(d.date * 1000).toISOString().split('T')[0],
        value: d.amount,
        label: `現金股利 ${d.amount.toFixed(4)} 元/股`,
      })),
      ...splits.map(s => ({
        type: 'rights',
        date: new Date(s.date * 1000).toISOString().split('T')[0],
        value: s.numerator / s.denominator,   // 拆分比例
        splitRatio: `${s.numerator}:${s.denominator}`,
        label: `股票分割 ${s.numerator}:${s.denominator}`,
      })),
    ].sort((a, b) => b.date.localeCompare(a.date));  // 新到舊

    const unrecorded = items.filter(i => !recordedDates.has(i.date));
    const recorded   = items.filter(i =>  recordedDates.has(i.date));

    if (!items.length) {
      panel.innerHTML = `
        <div class="px-5 py-4 text-sm text-slate-500">
          查無 ${symbol} 的除權息記錄（Yahoo Finance 可能無此資料）
          <button onclick="document.getElementById('dividendPanel').classList.add('hidden')" class="ml-3 text-xs text-slate-600 hover:text-slate-400">關閉</button>
        </div>`;
      return;
    }

    const rowHtml = (item, checked, disabled) => `
      <label class="flex items-center gap-3 px-4 py-3 hover:bg-white/[0.02] transition-colors cursor-pointer ${disabled ? 'opacity-40 cursor-not-allowed' : ''}">
        <input type="checkbox" class="dividend-checkbox w-4 h-4 rounded accent-yellow-400 shrink-0"
          value="${encodeURIComponent(JSON.stringify(item))}"
          ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${item.type === 'dividend' ? 'bg-yellow-500/15 text-yellow-400' : 'bg-violet-500/15 text-violet-400'}">
          ${item.type === 'dividend' ? '除息' : '除權'}
        </span>
        <span class="font-mono text-xs text-slate-400">${item.date}</span>
        <span class="text-sm text-slate-200 flex-1">${item.label}</span>
        ${disabled ? '<span class="text-xs text-slate-600 shrink-0">已記錄</span>' : ''}
      </label>`;

    panel.innerHTML = `
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-yellow-500/15">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-yellow-400">✦ 除權息記錄</span>
          <span class="text-xs text-slate-500">${unrecorded.length} 筆未匯入 · 共 ${items.length} 筆</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="importDividendEvents('${stockId}')"
            class="text-xs font-semibold px-3 py-1.5 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 rounded-lg border border-yellow-500/30 transition-all">
            匯入勾選項目
          </button>
          <button onclick="document.getElementById('dividendPanel').classList.add('hidden')" class="text-slate-500 hover:text-white text-lg leading-none transition-colors">×</button>
        </div>
      </div>
      <div class="divide-y divide-white/[0.03]" id="dividendList">
        ${unrecorded.map(i => rowHtml(i, true,  false)).join('')}
        ${recorded  .map(i => rowHtml(i, false, true )).join('')}
      </div>
      ${unrecorded.length === 0 ? '<p class="text-xs text-slate-600 text-center py-4">所有除權息記錄皆已匯入</p>' : ''}
    `;

  } catch(e) {
    panel.innerHTML = `
      <div class="px-5 py-4 text-sm text-red-400">
        查詢失敗：${e.message}
        <button onclick="document.getElementById('dividendPanel').classList.add('hidden')" class="ml-3 text-xs text-slate-600 hover:text-slate-400">關閉</button>
      </div>`;
  }
}

function importDividendEvents(stockId) {
  const stock    = state.stocks.find(s => s.id === stockId);
  const checkboxes = document.querySelectorAll('.dividend-checkbox:checked:not(:disabled)');
  if (!checkboxes.length) { alert('請至少勾選一項'); return; }

  for (const cb of checkboxes) {
    const item = JSON.parse(decodeURIComponent(cb.value));
    const { totalQty } = calcStats(stock.trades);

    if (item.type === 'dividend') {
      stock.trades.push({ type: 'dividend', qty: totalQty, price: item.value, date: item.date });
    } else if (item.type === 'rights') {
      // 股票分割：計算新增股數
      // splitRatio = numerator:denominator，例 2:1 表示每 1 股變 2 股
      const [num, den] = item.splitRatio.split(':').map(Number);
      const newShares = Math.round(totalQty * (num / den - 1));
      if (newShares > 0) stock.trades.push({ type: 'rights', qty: newShares, price: 0, date: item.date });
    }
  }

  // 依日期排序交易記錄
  stock.trades.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  saveState();
  document.getElementById('dividendPanel').classList.add('hidden');
  render();
}

async function initFirebase() {
  const { initializeApp }   = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
  const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js");
  const { getFirestore, doc, getDoc, setDoc }
    = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // 登入 / 登出（直接存取 state，同 scope）
  window._loginWithGoogle = async function() {
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch(e) {
      errEl.textContent = '登入失敗：' + e.message;
      errEl.classList.remove('hidden');
    }
  };

  window._logoutUser = async function() {
    if (!confirm('確定要登出？')) return;
    await signOut(auth);
    state.stocks = []; state.prices = {}; state.activeId = null;
    render();
  };

  // 存雲端
  async function saveToCloud() {
    const user = auth.currentUser;
    if (!user) return;
    try {
      await setDoc(doc(db, 'users', user.uid),
        { stocks: state.stocks, activeId: state.activeId, updatedAt: Date.now() }
      );
    } catch(e) { console.error('save error', e); }
  }

  // 覆寫 saveState，同時存 localStorage 和 Firestore
  const _origSave = saveState;
  saveState = async function() {
    localStorage.setItem('stockCalc_v3', JSON.stringify({ stocks: state.stocks, activeId: state.activeId }));
    await saveToCloud();
  };

  // Auth 狀態監聽
  onAuthStateChanged(auth, async user => {
    if (user) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');
      const el = document.getElementById('userAvatar');
      if (el) el.src = user.photoURL || '';
      const un = document.getElementById('userName');
      if (un) un.textContent = user.displayName || user.email;

      // 從 Firestore 載入資料
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists()) {
          const d = snap.data();
          state.stocks   = d.stocks   || [];
          state.activeId = d.activeId || null;
        } else {
          loadState(); // 首次登入：從 localStorage 遷移
          await saveToCloud();
        }
        if (!state.activeId || !state.stocks.find(s => s.id === state.activeId)) {
          state.activeId = state.stocks[0]?.id ?? null;
        }
      } catch(e) {
        console.error('load error', e);
        loadState();
      }

      render();
      if (state.stocks.length) refreshAllPrices();
    } else {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appShell').classList.add('hidden');
    }
  });
}
